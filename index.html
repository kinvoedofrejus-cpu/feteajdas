<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J’y serai – Fête AJDAS 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4faf1;--card:#ffffff;--ink:#12351b;--mut:#4d6a53;--g:#0f7a2a;--g2:#0a5a1e;--o:#f26a10;--y:#ffd21a;--line:#cfe3c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a10;--card:#14281a;--ink:#eaf6e6;--mut:#a5c2a9;--line:#27432d}}
:root[data-theme="dark"]{--bg:#0c1a10;--card:#14281a;--ink:#eaf6e6;--mut:#a5c2a9;--line:#27432d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
main{max-width:560px;margin:0 auto;padding:18px 16px 28px}
h1{font-size:clamp(26px,7vw,36px);line-height:1.05;margin:4px 0 6px;font-weight:800;color:var(--g)}
h1 span{color:var(--o)}
.sub{color:var(--mut);margin:0 0 16px;font-size:16px}
.stage{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px;touch-action:none}
canvas{display:block;width:100%;height:auto;border-radius:12px;cursor:grab;background:#fff}
canvas.drag{cursor:grabbing}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button,.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;flex:1 1 200px;min-height:48px}
.primary{background:var(--g);color:#fff}
.accent{background:var(--o);color:#fff}
.soft{background:var(--card);color:var(--g);border:2px solid var(--g)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.zoom{display:none;margin-top:14px;align-items:center;gap:12px}
.zoom.on{display:flex}
.zoom input{flex:1;accent-color:var(--o)}
.zoom label{font-weight:600;color:var(--mut)}
.hint{color:var(--mut);font-size:15px;margin:10px 2px 0}
#msg{min-height:22px;margin-top:10px;font-weight:600;color:var(--g)}
footer{margin-top:26px;padding-top:14px;border-top:2px solid var(--line);color:var(--mut);font-size:15px;text-align:center}
footer b{color:var(--ink)}
footer a{color:var(--g);font-weight:600}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>J’y serai <span>à Sota !</span></h1>
  <p class="sub">Fête AJDAS 2027, les 8 et 9 janvier. Crée ton affiche en 10 secondes.</p>

  <div class="stage"><canvas id="cv" width="1254" height="1254" aria-label="Aperçu de ton affiche"></canvas></div>

  <div class="zoom" id="zoomBox">
    <label for="zoom">Zoom</label>
    <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
  </div>
  <p class="hint" id="hint">Choisis une belle photo de toi : elle se place derrière l’affiche.</p>

  <div class="row">
    <button class="primary" id="pick">Importer ma photo</button>
    <button class="soft" id="reset" disabled>Recentrer</button>
  </div>
  <div class="row">
    <button class="accent" id="dl" disabled>Télécharger mon affiche</button>
    <button class="accent" id="share" disabled>Partager</button>
  </div>
  <div class="row">
    <a class="btn soft" id="wa" target="_blank" rel="noopener">Inviter sur WhatsApp</a>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept="image/*">

  <footer>
    Plateforme conçue par <b>KinvosHub</b><br>
    <a href="tel:0166661846">0166661846</a> · <a href="mailto:contact@ficheprobot.site">contact@ficheprobot.site</a>
  </footer>
</main>

const S = 1254;
const BOX = {x:0, y:200, w:780, h:780};      // zone de la photo (couche du dessous)
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let overlay = null, photo = null, zoom = 1, ox = 0, oy = 0;

const sm = (a,b,x)=>{let t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

function buildOverlay(img){
  const c = document.createElement('canvas'); c.width=c.height=S;
  const t = c.getContext('2d'); t.drawImage(img,0,0,S,S);
  const id = t.getImageData(0,0,S,S), d = id.data;
  // trou fondu : rectangle arrondi à gauche de l'affiche
  const cx=220, cy=587.5, hw=520, hh=347.5, r=120, F=100;
  const prot=[[0,835,110,175],[110,975,140,200],[150,262,40,95]]; // feuilles / tambour conservés
  for(let y=0;y<S;y++){
    for(let x=0;x<S;x++){
      const qx=Math.abs(x-cx)-(hw-r), qy=Math.abs(y-cy)-(hh-r);
      const sdf=Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-r;
      let h=sm(0,F,-sdf);
      if(h>0){
        let p=0;
        for(const [px,py,r0,r1] of prot){p=Math.max(p,1-sm(r0,r1,Math.hypot(x-px,y-py)))}
        h*=1-p;
      }
      d[(y*S+x)*4+3]=Math.round(255*(1-h));
    }
  }
  t.putImageData(id,0,0);
  return c;
}

function draw(){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,S,S);
  if(photo){
    const base=Math.max(BOX.w/photo.width, BOX.h/photo.height)*zoom;
    const w=photo.width*base, h=photo.height*base;
    const x=BOX.x+BOX.w/2-w/2+ox, y=BOX.y+BOX.h/2-h/2+oy;
    ctx.save(); ctx.beginPath(); ctx.rect(BOX.x,BOX.y,BOX.w,BOX.h); ctx.clip();
    ctx.drawImage(photo,x,y,w,h); ctx.restore();
  }
  if(overlay) ctx.drawImage(overlay,0,0);
  if(!photo && overlay){
    ctx.fillStyle='rgba(15,122,42,.85)'; ctx.textAlign='center';
    ctx.font='800 54px "Baloo 2",system-ui,sans-serif';
    ctx.fillText('Ta photo ici',370,560);
    ctx.font='600 34px "Baloo 2",system-ui,sans-serif';
    ctx.fillText('Touche « Importer ma photo »',370,615);
  }
}

function clampPan(){
  if(!photo) return;
  const base=Math.max(BOX.w/photo.width, BOX.h/photo.height)*zoom;
  const mx=Math.max(0,(photo.width*base-BOX.w)/2), my=Math.max(0,(photo.height*base-BOX.h)/2);
  ox=Math.min(mx,Math.max(-mx,ox)); oy=Math.min(my,Math.max(-my,oy));
}

const tpl = new Image();
tpl.onload=()=>{overlay=buildOverlay(tpl);draw()};
tpl.src=TPL_SRC;

$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{
    photo=im; zoom=1; ox=oy=0; $('zoom').value=1;
    $('zoomBox').classList.add('on');
    ['reset','dl','share'].forEach(i=>$(i).disabled=false);
    $('pick').textContent='Changer de photo';
    $('hint').textContent='Glisse la photo pour la cadrer, utilise le zoom pour l’ajuster.';
    $('msg').textContent=''; draw();
  };
  im.onerror=()=>{$('msg').textContent='Cette image n’a pas pu être lue. Essaie une autre photo.'};
  im.src=url;
};
$('zoom').oninput=e=>{zoom=+e.target.value;clampPan();draw()};
$('reset').onclick=()=>{zoom=1;ox=oy=0;$('zoom').value=1;draw()};

let drag=null;
cv.addEventListener('pointerdown',e=>{if(!photo)return;drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const k=S/cv.getBoundingClientRect().width;
  ox=drag.ox+(e.clientX-drag.x)*k; oy=drag.oy+(e.clientY-drag.y)*k; clampPan(); draw();
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null;cv.classList.remove('drag')}));

const toBlob=()=>new Promise(r=>cv.toBlob(r,'image/png'));
const NAME='j-y-serai-ajdas-2027.png';

$('dl').onclick=async()=>{
  const b=await toBlob();
  try{
    const dls=await claude.use('downloads');
    if(dls){await dls.save({filename:NAME,data:b});$('msg').textContent='Ton affiche est enregistrée. Partage-la !';return}
  }catch(err){ if(err&&err.code==='declined')return; }
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=NAME;document.body.appendChild(a);a.click();a.remove();
  $('msg').textContent='Ton affiche est prête. Partage-la !';
};

const TXT='J’y serai à la fête AJDAS 2027, les 8 et 9 janvier à Sota ! Et toi ? Crée ton affiche ici :';
$('share').onclick=async()=>{
  const b=await toBlob(), f=new File([b],NAME,{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:TXT+' '+location.href});return}
    if(navigator.share){await navigator.share({text:TXT,url:location.href});return}
  }catch(err){ if(err&&err.name==='AbortError')return; }
  $('msg').textContent='Télécharge ton affiche, puis envoie-la à tes amis ou utilise le bouton WhatsApp.';
};
